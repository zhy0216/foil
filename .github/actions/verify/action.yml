name: Verify Foil
description: Install the pinned toolchain, audit dependencies, and check the workspace.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .node-version

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - run: bun install --frozen-lockfile
      shell: bash

    - run: bun run typecheck
      shell: bash

    - run: bun run test
      shell: bash

    - run: bun audit
      shell: bash
      env:
        npm_config_registry: https://registry.npmjs.org

    - run: bun audit --prod
      shell: bash
      env:
        npm_config_registry: https://registry.npmjs.org

    - name: Install Chromium and WebKit
      run: bun run test:e2e:install --with-deps
      shell: bash

    # Explicit phase order keeps real password KDF units clear of builds/browsers.
    - name: Build both applications
      run: bun run build
      shell: bash

    # Turbo reuses those builds, packages the extension once, and gives each
    # browser suite its own strict preview port. The ZIP is loaded after extraction.
    - name: Run website, installed extension and local-file browser tests
      run: bun run test:e2e
      shell: bash

    - name: Keep the verified extension package for local review
      uses: actions/upload-artifact@v5
      with:
        name: foil-extension
        path: apps/extension/artifacts/foil-extension-*.zip
        if-no-files-found: error
        retention-days: 7

    - name: Keep browser failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-results
        path: |
          apps/web/playwright-report/
          apps/web/test-results/
          apps/extension/playwright-report/
          apps/extension/test-results/
        if-no-files-found: ignore
        retention-days: 7
